plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.udmkyl.app'
    compileSdk 34

    defaultConfig {
        applicationId "ru.udmkyl.app"
        minSdk 26          // Android 8.0
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Для хакатона release подписывается отладочным ключом — APK сразу ставится на телефон.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
